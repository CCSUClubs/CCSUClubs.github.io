<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCSU Clubs</title>
<meta name="description" content="Student-made sites for CCSU clubs.">
<meta name="theme-color" content="#1834d8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d228c" media="(prefers-color-scheme: dark)">

<!-- Favicon & Icons -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- OpenGraph / Social Cards -->
<meta property="og:type" content="website">
<meta property="og:title" content="CCSU Clubs">
<meta property="og:description" content="Student-made sites for CCSU clubs.">
<meta property="og:image" content="https://ccsuclubs.github.io/og-image.png">
<meta property="og:url" content="https://ccsuclubs.github.io/">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="CCSU Clubs">
<meta name="twitter:description" content="Student-made sites for CCSU clubs.">
<meta name="twitter:image" content="https://ccsuclubs.github.io/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
  :root { 
    --royal: #1834d8; 
    --lift: #3051f1; 
    --sun: #ffcf33; 
    --gutter: clamp(1.5rem, 5vw, 3rem);
    color-scheme: light dark;
    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif; 
  }
  @media (prefers-color-scheme: dark) { 
    :root { 
      --royal: #0f2596; 
      --lift: #1c38cc; 
    } 
  }
  * { box-sizing: border-box; }
  html, body { 
    margin: 0; 
    padding: 0;
    width: 100%;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
  }
  body { 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between;
    position: relative; 
    background: radial-gradient(circle at 15% 15%, var(--lift) 0%, var(--royal) 70%);
    color: #fff; 
    font-family: var(--display); 
    -webkit-font-smoothing: antialiased;
  }

  /* Ambient background shapes */
  body::before, body::after { 
    content: ""; 
    position: absolute; 
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.04); 
    pointer-events: none;
    z-index: 0;
  }
  body::after { 
    right: -10rem; 
    top: -8rem; 
    width: 35rem; 
    height: 35rem; 
    animation: bob 8s ease-in-out infinite alternate; 
  }
  body::before {
    left: -12rem;
    bottom: -12rem;
    width: 30rem;
    height: 30rem;
    animation: bob 10s ease-in-out infinite alternate-reverse;
  }

  header, main, footer { 
    position: relative; 
    z-index: 1; 
    width: 100%; 
    max-width: 64rem; 
    margin: 0 auto; 
    padding-left: max(var(--gutter), env(safe-area-inset-left));
    padding-right: max(var(--gutter), env(safe-area-inset-right));
  }
  
  header { 
    padding-top: max(2rem, env(safe-area-inset-top)); 
    flex-shrink: 0;
  }
  
  .brand { 
    display: inline-flex; 
    align-items: center; 
    gap: .75rem; 
    font-weight: 700; 
    font-size: 1.15rem; 
    letter-spacing: -.02em; 
    color: #fff;
    text-decoration: none;
    opacity: 0.95;
    transition: opacity .15s ease;
  }
  .brand:hover {
    opacity: 1;
  }
  .brand-mark {
    width: 1.75rem;
    height: 1.75rem;
    flex-shrink: 0;
    overflow: visible;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
  }

  main { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    padding-top: 1rem;
    padding-bottom: 1rem;
    min-height: 0;
  }

  h1 { 
    margin: 0 0 clamp(1.75rem, 4vh, 2.5rem); 
    max-width: 13ch; 
    font-weight: 800; 
    font-size: clamp(2.5rem, 8.5vw, 5.75rem); 
    line-height: 0.98; 
    letter-spacing: -.035em; 
    text-shadow: 0 2px 20px rgba(0,0,0,0.12);
  }
  .w { 
    display: inline-block; 
    animation: rise .8s cubic-bezier(.2,.7,.2,1) both; 
    animation-delay: calc(var(--i) * 80ms); 
  }

  /* Interactive Short-Link Pill Wrapper */
  .bar-wrap {
    position: relative;
    width: 100%;
    max-width: 100%;
    animation: rise .8s .45s cubic-bezier(.2,.7,.2,1) both;
  }

  .bar { 
    display: inline-flex;
    align-items: center;
    max-width: 100%; 
    padding: .85rem 1.65rem; 
    background: #ffffff; 
    color: #0b1533; 
    border-radius: 999px;
    font-weight: 600; 
    font-size: clamp(1.05rem, 3.5vw, 1.65rem); 
    line-height: 1.25; 
    letter-spacing: -.01em; 
    box-shadow: 0 16px 36px rgba(4, 11, 46, 0.25), 0 2px 6px rgba(4, 11, 46, 0.15); 
    transition: transform .2s cubic-bezier(.2,.7,.2,1), box-shadow .2s cubic-bezier(.2,.7,.2,1), padding-right .2s ease;
    cursor: text;
    overflow: hidden;
  }
  .bar.has-match {
    padding-right: .65rem;
  }
  .bar:focus-within {
    transform: translateY(-3px);
    box-shadow: 0 20px 44px rgba(4, 11, 46, 0.32), 0 0 0 4px rgba(255, 207, 51, 0.6);
  }
  .host { 
    color: #717c99; 
    white-space: nowrap;
    user-select: none;
    flex-shrink: 0;
    font-weight: 600;
  }

  /* Phantom Autocomplete Container Styles */
  .input-container {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-width: 0;
    flex: 1 1 auto;
  }
  .slug-input, .phantom-input {
    border: none;
    outline: none;
    background: transparent;
    font: inherit;
    font-weight: 700;
    letter-spacing: inherit;
    line-height: inherit;
    width: 9.5ch;
    min-width: 6ch;
    max-width: 100%;
    padding: 0;
    margin: 0;
  }
  .slug-input {
    color: #1834d8;
    caret-color: #1834d8;
    position: relative;
    z-index: 2;
  }
  .phantom-input {
    position: absolute;
    top: 0;
    left: 0;
    color: #1834d8;
    opacity: 0.35;
    pointer-events: none;
    z-index: 1;
    white-space: pre;
    overflow: hidden;
  }
  .slug-input::placeholder {
    color: #1834d8;
    opacity: 0.6;
  }
  .slug-input:focus::placeholder {
    opacity: 0.3;
  }

  /* Refined Go Button */
  .go-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-left: .75rem;
    width: clamp(2.35rem, 6vw, 2.75rem);
    height: clamp(2.35rem, 6vw, 2.75rem);
    border: none;
    border-radius: 50%;
    background: #1834d8;
    color: #fff;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 4px 14px rgba(24, 52, 216, 0.45);
  }
  .go-btn[hidden] {
    display: none;
  }
  .go-btn:hover {
    background: #1127b5;
    transform: scale(1.08);
    box-shadow: 0 6px 18px rgba(24, 52, 216, 0.6);
  }
  .go-btn:active {
    transform: scale(0.94);
  }
  .arrow-icon {
    width: 1.25rem;
    height: 1.25rem;
    transition: transform .2s cubic-bezier(.2,.7,.2,1);
  }
  .go-btn:hover .arrow-icon {
    transform: translateX(3px);
  }

  footer {
    padding-bottom: max(2rem, env(safe-area-inset-bottom));
    color: rgba(255, 255, 255, 0.75);
    font-size: clamp(0.85rem, 2.5vw, 0.95rem);
    font-weight: 500;
    line-height: 1.4;
    flex-shrink: 0;
    animation: rise .8s .65s cubic-bezier(.2,.7,.2,1) both;
  }
  footer .period {
    color: var(--sun);
    font-weight: 800;
  }

  /* Mobile refinements */
  @media (max-width: 480px) {
    .bar {
      width: 100%;
      padding: .75rem 1.2rem;
    }
    .bar.has-match {
      padding-right: .5rem;
    }
  }

  @keyframes rise { from { opacity: 0; transform: translateY(.6em); } }
  @keyframes bob { to { transform: translateY(2rem); } }
  @media (prefers-reduced-motion: reduce) { 
    *, *::before, *::after { animation: none !important; transition: none !important; } 
  }
</style>
</head>
<body>

<header>
  <a href="/" class="brand">
    <svg class="brand-mark" viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <path d="M 73 28 A 34 34 0 1 0 73 72" stroke="#ffffff" stroke-width="19" stroke-linecap="round"/>
      <circle cx="74" cy="50" r="12" fill="#ffcf33"/>
    </svg>
    CCSU Clubs
  </a>
</header>

<main>
  <h1>
    <span class="w" style="--i:0">Student-made</span> 
    <span class="w" style="--i:1">sites</span> 
    <span class="w" style="--i:2">for</span> 
    <span class="w" style="--i:3">CCSU</span> 
    <span class="w" style="--i:4">clubs.</span>
  </h1>

  <div class="bar-wrap">
    <form class="bar" id="jump-form" aria-label="Go to a club site">
      <span class="host" id="host"></span>
      <div class="input-container">
        <input 
          type="text" 
          id="slug-input" 
          class="slug-input" 
          placeholder="clubname" 
          autocomplete="off" 
          autocapitalize="none" 
          spellcheck="false"
          aria-label="Club slug"
        >
        <input 
          type="text" 
          id="phantom-input" 
          class="phantom-input" 
          tabindex="-1" 
          aria-hidden="true"
        >
      </div>
      <button type="submit" id="go-btn" class="go-btn" aria-label="Visit club site" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="arrow-icon">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>
  </div>
</main>

<footer>
  Built by Central Students for Central Students<span class="period">.</span>
</footer>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var currentHost = location.host || "ccsuclubs.github.io";
  $("host").textContent = currentHost + "/";

  var form = $("jump-form");
  var input = $("slug-input");
  var phantomInput = $("phantom-input");
  var goBtn = $("go-btn");

  var allClubs = [];
  var baseWidthCh = 9.5; // Matches "clubname" placeholder width

  fetch("clubs.json")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (Array.isArray(data)) {
        allClubs = data;
        updateUI();
      }
    })
    .catch(function () {});

  function findExactMatch(val) {
    var clean = val.trim().toLowerCase();
    if (!clean) return null;
    return allClubs.find(function (c) {
      return c.slug.toLowerCase() === clean;
    }) || null;
  }

  function getTargetUrl(club) {
    if (!club || !club.site) return "/" + encodeURIComponent(club.slug);
    return club.site.startsWith("http") ? club.site : "https://" + club.site;
  }

  function updateUI() {
    var raw = input.value;
    var rawTrim = raw.trim();

    updateAutocomplete(raw);

    var visibleLen = Math.max(raw.length, phantomInput.value.length);
    var dynamicWidth = Math.max(visibleLen + 0.5, baseWidthCh) + "ch";
    
    input.style.width = dynamicWidth;
    phantomInput.style.width = dynamicWidth;
    phantomInput.scrollLeft = input.scrollLeft;

    var exact = findExactMatch(rawTrim);
    if (exact) {
      goBtn.hidden = false;
      form.classList.add("has-match");
    } else {
      goBtn.hidden = true;
      form.classList.remove("has-match");
    }
  }

  function updateAutocomplete(query) {
    var q = query.toLowerCase();
    if (!q) {
      phantomInput.value = "";
      return;
    }

    var eligible = allClubs.filter(function (c) {
      return c.home !== false;
    });

    var match = eligible.find(function (c) {
      return c.slug.toLowerCase().startsWith(q);
    });

    if (match) {
      var suggestion = match.slug;
      var completion = query + suggestion.slice(query.length);
      phantomInput.value = completion;
    } else {
      phantomInput.value = "";
    }
  }

  input.addEventListener("input", updateUI);
  input.addEventListener("focus", updateUI);
  input.addEventListener("scroll", function () {
    phantomInput.scrollLeft = input.scrollLeft;
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Tab" || e.key === "ArrowRight") {
      if (phantomInput.value && phantomInput.value.toLowerCase().startsWith(input.value.toLowerCase()) && phantomInput.value.length > input.value.length) {
        e.preventDefault();
        input.value = phantomInput.value;
        updateUI();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }
  });

  form.addEventListener("click", function (e) {
    if (e.target.tagName !== "BUTTON" && !e.target.closest("button")) input.focus();
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var exact = findExactMatch(input.value);
    if (exact) {
      window.location.href = getTargetUrl(exact);
    }
  });
</script>
</body>
</html>
