<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCSU Clubs</title>
<meta name="description" content="Student-made sites for CCSU clubs.">
<meta name="theme-color" content="#1d3fd8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17308f" media="(prefers-color-scheme: dark)">

<!-- Favicon & Icons -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- OpenGraph / Social Cards -->
<meta property="og:type" content="website">
<meta property="og:title" content="CCSU Clubs">
<meta property="og:description" content="Student-made sites for CCSU clubs.">
<meta property="og:image" content="https://ccsuclubs.github.io/og-image.png">
<meta property="og:url" content="https://ccsuclubs.github.io/">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="CCSU Clubs">
<meta name="twitter:description" content="Student-made sites for CCSU clubs.">
<meta name="twitter:image" content="https://ccsuclubs.github.io/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
  :root { 
    --royal: #1d3fd8; 
    --lift: #3258f0; 
    --sun: #ffcf33; 
    color-scheme: light dark;
    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif; 
  }
  @media (prefers-color-scheme: dark) { 
    :root { 
      --royal: #17308f; 
      --lift: #2342b5; 
    } 
  }
  * { box-sizing: border-box; }
  html, body { 
    margin: 0; 
    padding: 0;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
  }
  body { 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between;
    position: relative; 
    background: radial-gradient(circle at 20% 20%, var(--lift) 0%, var(--royal) 65%);
    color: #fff; 
    font-family: var(--display); 
  }

  /* Ambient background shapes */
  body::before, body::after { 
    content: ""; 
    position: absolute; 
    border-radius: 50%;
    background: var(--lift); 
    opacity: 0.65;
    pointer-events: none;
    z-index: 0;
  }
  body::after { 
    right: -9rem; 
    top: -6rem; 
    width: 30rem; 
    height: 30rem; 
    animation: bob 7s ease-in-out infinite alternate; 
  }
  body::before {
    left: -12rem;
    bottom: -12rem;
    width: 26rem;
    height: 26rem;
    animation: bob 9s ease-in-out infinite alternate-reverse;
  }

  header, main, footer { 
    position: relative; 
    z-index: 1; 
    width: 100%; 
    max-width: 60rem; 
    margin: 0 auto; 
    padding: 0 1.5rem; 
  }
  header { padding-top: 1.5rem; }
  .brand { 
    display: inline-flex; 
    align-items: center; 
    gap: .65rem; 
    font-weight: 700; 
    font-size: 1.15rem; 
    letter-spacing: -.01em; 
    color: #fff;
    text-decoration: none;
  }
  .brand-mark {
    width: 1.65rem;
    height: 1.65rem;
    flex-shrink: 0;
    overflow: visible;
  }

  main { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    padding: 1rem 0; 
  }

  h1 { 
    margin: 0 0 2rem; 
    max-width: 13ch; 
    font-weight: 800; 
    font-size: clamp(2.4rem, 8vw, 5.5rem); 
    line-height: 1; 
    letter-spacing: -.03em; 
  }
  .w { 
    display: inline-block; 
    animation: rise .8s cubic-bezier(.2,.7,.2,1) both; 
    animation-delay: calc(var(--i) * 90ms); 
  }

  /* Interactive Short-Link Pill Wrapper */
  .bar-wrap {
    position: relative;
    align-self: flex-start;
    max-width: 100%;
    animation: rise .8s .55s cubic-bezier(.2,.7,.2,1) both;
  }

  .bar { 
    display: inline-flex;
    align-items: center;
    max-width: 100%; 
    padding: .75rem 1.5rem; 
    background: #fff; 
    color: #0b1533; 
    border-radius: 999px;
    font-weight: 600; 
    font-size: clamp(1.05rem, 3.4vw, 1.75rem); 
    line-height: 1.25; 
    letter-spacing: -.01em; 
    box-shadow: 0 8px 0 rgba(6,16,70,.35); 
    transition: transform .18s ease, box-shadow .18s ease, padding-right .2s ease;
    cursor: text;
  }
  .bar.has-match {
    padding-right: .65rem;
  }
  .bar:focus-within {
    transform: translateY(-2px);
    box-shadow: 0 10px 0 rgba(6,16,70,.4), 0 0 0 3px var(--sun);
  }
  .host { 
    color: #6a7491; 
    white-space: nowrap;
    user-select: none;
  }

  /* Phantom Autocomplete Container Styles */
  .input-container {
    position: relative;
    display: inline-block;
  }
  .slug-input, .phantom-input {
    border: none;
    outline: none;
    background: transparent;
    font: inherit;
    font-weight: 700;
    width: 9.5ch;
    min-width: 9.5ch;
    max-width: 25ch;
    padding: 0;
    margin: 0;
  }
  .slug-input {
    color: #1d3fd8;
    caret-color: #1d3fd8;
    position: relative;
    z-index: 2;
  }
  .phantom-input {
    position: absolute;
    top: 0;
    left: 0;
    color: #1d3fd8;
    opacity: 0.35;
    pointer-events: none;
    z-index: 1;
    white-space: pre;
  }
  .slug-input::placeholder {
    color: #1d3fd8;
    opacity: 0.7;
  }
  .slug-input:focus::placeholder {
    opacity: 0.35;
  }

  /* Upgraded Go Button */
  .go-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-left: .65rem;
    width: 2.6rem;
    height: 2.6rem;
    border: none;
    border-radius: 50%;
    background: #1d3fd8;
    color: #fff;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 4px 12px rgba(29, 63, 216, 0.4);
  }
  .go-btn[hidden] {
    display: none;
  }
  .go-btn:hover {
    background: #142ea8;
    transform: scale(1.08);
    box-shadow: 0 6px 16px rgba(29, 63, 216, 0.5);
  }
  .go-btn:active {
    transform: scale(0.95);
  }
  .arrow-icon {
    width: 1.25rem;
    height: 1.25rem;
    transition: transform .2s ease;
  }
  .go-btn:hover .arrow-icon {
    transform: translateX(2px);
  }

  footer {
    padding-bottom: 1.5rem;
    color: rgba(255, 255, 255, 0.72);
    font-size: .95rem;
    font-weight: 500;
    animation: rise .8s .75s cubic-bezier(.2,.7,.2,1) both;
  }
  footer .period {
    color: var(--sun);
    font-weight: 800;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(.6em); } }
  @keyframes bob { to { transform: translateY(2rem); } }
  @media (prefers-reduced-motion: reduce) { 
    *, *::before, *::after { animation: none !important; transition: none !important; } 
  }
</style>
</head>
<body>

<header>
  <a href="/" class="brand">
    <svg class="brand-mark" viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <path d="M 73 28 A 34 34 0 1 0 73 72" stroke="#ffffff" stroke-width="19" stroke-linecap="round"/>
      <circle cx="74" cy="50" r="12" fill="#ffcf33"/>
    </svg>
    CCSU Clubs
  </a>
</header>

<main>
  <h1>
    <span class="w" style="--i:0">Student-made</span> 
    <span class="w" style="--i:1">sites</span> 
    <span class="w" style="--i:2">for</span> 
    <span class="w" style="--i:3">CCSU</span> 
    <span class="w" style="--i:4">clubs.</span>
  </h1>

  <div class="bar-wrap">
    <form class="bar" id="jump-form" aria-label="Go to a club site">
      <span class="host" id="host"></span>
      <div class="input-container">
        <input 
          type="text" 
          id="slug-input" 
          class="slug-input" 
          placeholder="clubname" 
          autocomplete="off" 
          autocapitalize="none" 
          spellcheck="false"
          aria-label="Club slug"
        >
        <input 
          type="text" 
          id="phantom-input" 
          class="phantom-input" 
          tabindex="-1" 
          aria-hidden="true"
        >
      </div>
      <button type="submit" id="go-btn" class="go-btn" aria-label="Visit club site" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="arrow-icon">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>
  </div>
</main>

<footer>
  Built by Central Students for Central Students<span class="period">.</span>
</footer>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var currentHost = location.host || "ccsuclubs.github.io";
  $("host").textContent = currentHost + "/";

  var form = $("jump-form");
  var input = $("slug-input");
  var phantomInput = $("phantom-input");
  var goBtn = $("go-btn");

  var allClubs = [];
  var baseWidthCh = 9.5; // Matches "clubname" placeholder width

  fetch("clubs.json")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (Array.isArray(data)) {
        allClubs = data;
        updateUI();
      }
    })
    .catch(function () {});

  function findExactMatch(val) {
    var clean = val.trim().toLowerCase();
    if (!clean) return null;
    return allClubs.find(function (c) {
      return c.slug.toLowerCase() === clean;
    }) || null;
  }

  function getTargetUrl(club) {
    if (!club || !club.site) return "/" + encodeURIComponent(club.slug);
    return club.site.startsWith("http") ? club.site : "https://" + club.site;
  }

  function updateUI() {
    var raw = input.value;
    var rawTrim = raw.trim();
    var len = raw.length;
    
    // Default to placeholder size, expand dynamically only if text exceeds base size
    var dynamicWidth = Math.max(len + 0.5, baseWidthCh) + "ch";
    
    input.style.width = dynamicWidth;
    phantomInput.style.width = dynamicWidth;

    var exact = findExactMatch(rawTrim);
    if (exact) {
      goBtn.hidden = false;
      form.classList.add("has-match");
    } else {
      goBtn.hidden = true;
      form.classList.remove("has-match");
    }

    updateAutocomplete(raw);
  }

  function updateAutocomplete(query) {
    var q = query.toLowerCase();
    if (!q) {
      phantomInput.value = "";
      return;
    }

    var eligible = allClubs.filter(function (c) {
      return c.home !== false;
    });

    var match = eligible.find(function (c) {
      return c.slug.toLowerCase().startsWith(q);
    });

    if (match) {
      var suggestion = match.slug;
      var completion = query + suggestion.slice(query.length);
      phantomInput.value = completion;
    } else {
      phantomInput.value = "";
    }
  }

  input.addEventListener("input", updateUI);
  input.addEventListener("focus", updateUI);

  input.addEventListener("keydown", function (e) {
    if (e.key === "Tab" || e.key === "ArrowRight") {
      if (phantomInput.value && phantomInput.value.toLowerCase().startsWith(input.value.toLowerCase())) {
        e.preventDefault();
        input.value = phantomInput.value;
        updateUI();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }
  });

  form.addEventListener("click", function (e) {
    if (e.target.tagName !== "BUTTON" && !e.target.closest("button")) input.focus();
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var exact = findExactMatch(input.value);
    if (exact) {
      window.location.href = getTargetUrl(exact);
    }
  });
</script>
</body>
</html>
