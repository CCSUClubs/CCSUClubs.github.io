<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCSU Clubs</title>

<!-- Favicon & Icons -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- OpenGraph / Social Cards -->
<meta property="og:type" content="website">
<meta property="og:title" content="CCSU Clubs">
<meta property="og:description" content="Student-made sites for CCSU clubs.">
<meta property="og:image" content="https://ccsuclubs.github.io/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
  :root { 
    --royal: #1d3fd8; 
    --lift: #3258f0; 
    --sun: #ffcf33; 
    color-scheme: light dark;
    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif; 
  }
  @media (prefers-color-scheme: dark) { 
    :root { 
      --royal: #17308f; 
      --lift: #2342b5; 
    } 
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { 
    min-height: 100vh; 
    min-height: 100svh; 
    display: flex; 
    flex-direction: column; 
    position: relative; 
    overflow-x: hidden;
    background: var(--royal); 
    color: #fff; 
    font-family: var(--display); 
  }
  body::after { 
    content: ""; 
    position: absolute; 
    right: -9rem; 
    top: -6rem; 
    width: 30rem; 
    height: 30rem; 
    border-radius: 50%;
    background: var(--lift); 
    animation: bob 7s ease-in-out infinite alternate; 
    z-index: 0;
  }
  header, main { 
    position: relative; 
    z-index: 1; 
    width: 100%; 
    max-width: 60rem; 
    margin: 0 auto; 
    padding: 0 1.5rem; 
  }
  header { padding-top: 1.75rem; }
  .brand { display: flex; align-items: center; gap: .75rem; font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; text-decoration: none; color: #fff; }
  .brand img { width: 1.5rem; height: 1.5rem; border-radius: 0.35rem; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-top: 2rem; padding-bottom: 5rem; }

  .hidden { display: none !important; }

  /* Dynamic Redirect State */
  .redirect-state { display: flex; flex-direction: column; gap: 1rem; }
  .bar { 
    align-self: flex-start; 
    max-width: 100%; 
    padding: .8rem 1.5rem; 
    background: #fff; 
    color: #0b1533; 
    border-radius: 999px;
    font-weight: 600; 
    font-size: clamp(1.1rem, 3.6vw, 1.9rem); 
    line-height: 1.25; 
    letter-spacing: -.01em; 
    overflow-wrap: anywhere;
    box-shadow: 0 7px 0 rgba(6,16,70,.35); 
    animation: rise .6s cubic-bezier(.2,.7,.2,1) both; 
  }
  .host { color: #6a7491; }
  .slug-text { color: #1d3fd8; }
  .status-msg {
    color: #dbe4ff;
    font-size: 1.2rem;
    font-weight: 500;
    animation: rise .6s .2s cubic-bezier(.2,.7,.2,1) both;
  }

  /* 404 Error State */
  h1.error-code { margin: 0; font-weight: 800; font-size: clamp(5rem, 16vw, 10rem); line-height: 0.9; letter-spacing: -.04em; color: var(--sun); }
  h2.error-title { margin: 0 0 1.5rem; font-weight: 800; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: -.02em; }
  p.error-desc { max-width: 25ch; margin: 0 0 2rem; color: #dbe4ff; font-weight: 500; font-size: 1.2rem; line-height: 1.4; }
  .btn-home {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    padding: .8rem 1.75rem;
    background: #fff;
    color: #1d3fd8;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1.1rem;
    text-decoration: none;
    box-shadow: 0 6px 0 rgba(6,16,70,.35);
    transition: transform .15s ease;
  }
  .btn-home:hover { transform: translateY(-2px); }

  @keyframes rise { from { opacity: 0; transform: translateY(.6em); } }
  @keyframes bob { to { transform: translateY(2rem); } }
  @media (prefers-reduced-motion: reduce) { 
    *, *::after { animation: none !important; transition: none !important; } 
  }
</style>
</head>
<body>

<header><a href="/" class="brand"><img src="favicon.png" alt="CCSU Clubs Logo">CCSU Clubs</a></header>

<main>
  <!-- Redirect loading view -->
  <div id="redirect-view" class="redirect-state">
    <div class="bar"><span class="host" id="host"></span><span class="slug-text" id="target-slug"></span></div>
    <p class="status-msg">Redirecting to club site...</p>
  </div>

  <!-- Stylish 404 view -->
  <div id="error-view" class="hidden">
    <h1 class="error-code">404</h1>
    <h2 class="error-title">Club not found.</h2>
    <p class="error-desc" id="error-desc">We couldn't find a short link registered for this path.</p>
    <a href="/" class="btn-home">&larr; Back to CCSU Clubs</a>
  </div>
</main>

<script>
  var $ = function (id) { return document.getElementById(id); };
  
  var currentHost = location.host || "ccsuclubs.github.io";
  $("host").textContent = currentHost + "/";

  var path = location.pathname.replace(/^\/+|\/+$/g, "");
  var slug = path.split('/')[0];

  $("target-slug").textContent = slug;

  if (slug && slug !== "404.html" && slug !== "index.html") {
    fetch("clubs.json")
      .then(function (r) { return r.json(); })
      .then(function (clubs) {
        var match = clubs.find(function (c) { 
          return c.slug.toLowerCase() === slug.toLowerCase(); 
        });

        if (match && match.site) {
          var target = match.site.startsWith("http") ? match.site : "https://" + match.site;
          window.location.replace(target);
        } else {
          show404("No club link exists for \"" + slug + "\".");
        }
      })
      .catch(function () {
        show404("Unable to load clubs.");
      });
  } else {
    show404("Page not found.");
  }

  function show404(message) {
    $("redirect-view").classList.add("hidden");
    if (message) $("error-desc").textContent = message;
    $("error-view").classList.remove("hidden");
  }
</script>
</body>
</html>
